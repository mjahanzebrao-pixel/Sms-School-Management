<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Management System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;
  background:#FBFAF6;color:#7C8F9B;
  font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
</style>
</head>
<body>
<div>Loading…</div>
<script>
(async function(){
  try{
    const sb = supabase.createClient(SMS_CONFIG.url, SMS_CONFIG.anonKey);
    const {data:{session}} = await sb.auth.getSession();
    location.replace(session ? 'students.html' : 'login.html');
  }catch(e){
    location.replace('login.html');
  }
})();
</script>
</body>
</html>
