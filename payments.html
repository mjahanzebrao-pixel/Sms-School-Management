<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fee Deposit — School Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{
  --ink:#14232E; --ink-2:#3D5261; --ink-3:#7C8F9B;
  --paper:#FBFAF6; --ledger:#E7EDE5; --ledger-line:#CBD8C8; --rule:#D3D8D2;
  --oxide:#A8332A; --oxide-soft:#F3E2E0;
  --seal:#2E6B4F; --seal-soft:#E1EDE5;
  --amber:#9A6B12; --amber-soft:#F6EBD5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.14em;font-weight:600;font-size:12px;color:var(--ink-3)}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px 90px}

.topbar{border-bottom:2px solid var(--ink);padding:16px 0 12px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.crest{width:38px;height:38px;flex:none;border:1.5px solid var(--ink);display:grid;
  place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px}
.brand h1{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:600;
  letter-spacing:.03em;margin:0;text-transform:uppercase}
.brand .sub{font-size:12px;color:var(--ink-3);margin-top:-2px}
a.btn{text-decoration:none;display:inline-block}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nav a.btn.here{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.tabs{display:flex;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.13em;
  font-size:13px;font-weight:600;color:var(--ink-3);background:none;border:0;
  border-bottom:3px solid transparent;padding:13px 18px 10px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--oxide)}
.view{display:none;padding-top:26px}
.view.on{display:block}

.head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  flex-wrap:wrap;margin-bottom:18px}
.head h2{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:600;
  letter-spacing:.02em;margin:0;text-transform:uppercase}

button,select,input{font-family:inherit;font-size:14px}
.btn{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;
  font-size:12.5px;font-weight:600;border:1px solid var(--rule);background:#fff;
  color:var(--ink-2);padding:9px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.go{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.go:hover{background:#245740}
.btn.danger{color:var(--oxide);border-color:var(--oxide-soft)}
.btn.danger:hover{background:var(--oxide);color:#fff;border-color:var(--oxide)}
.btn.sm{padding:5px 9px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:block;margin-bottom:14px}
.field .lbl{display:block;margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select{
  width:100%;padding:9px 11px;border:1px solid var(--rule);background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--oxide);outline-offset:-1px;border-color:var(--oxide)}

.panel{border:1px solid var(--rule);background:#fff}
.panelhead{padding:11px 14px;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
thead th{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.13em;
  font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:left;padding:11px 12px;
  border-bottom:1.5px solid var(--ink);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--ledger-line);font-size:14px}
tbody tr:nth-child(even){background:var(--ledger)}
td.r,th.r{text-align:right}
td.r{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
td .nm{font-weight:600}
td .fa{color:var(--ink-3);font-size:12.5px}

.searchbig{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.searchbig input{font-size:17px;padding:13px 15px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-bottom:20px}
.stat{background:#fff;padding:14px}
.stat .v{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;margin-top:4px}
.stat.ok .v{color:var(--seal)}
.stat.bad .v{color:var(--oxide)}

.studentcard{border:1px solid var(--ink);background:#fff;margin-bottom:20px}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:16px 18px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.sc-top h3{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:600;
  margin:0;letter-spacing:.02em;text-transform:uppercase}
.sc-top .meta{font-size:13px;color:var(--ink-3);margin-top:2px}
.sc-bal{text-align:right}
.sc-bal .lbl{margin-bottom:2px}
.sc-bal .v{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;line-height:1}
.sc-bal .v.owed{color:var(--oxide)}
.sc-bal .v.clear{color:var(--seal)}

.payrow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end;
  padding:16px 18px;background:var(--ledger);border-top:1px solid var(--rule)}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

.pill{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;
  font-size:11px;font-weight:600;padding:3px 7px;border:1px solid}
.pill.unpaid{color:var(--oxide);border-color:var(--oxide);background:var(--oxide-soft)}
.pill.partial{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.pill.paid{color:var(--seal);border-color:var(--seal);background:var(--seal-soft)}
.pill.rev{color:var(--ink-3);border-color:var(--rule);background:var(--paper)}

.banner{border:1px solid var(--amber);background:var(--amber-soft);color:#5C420B;
  padding:11px 14px;font-size:13.5px;margin:18px 0}
.banner.ok{border-color:var(--seal);background:var(--seal-soft);color:#1F4A36}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);
  color:var(--paper);padding:12px 20px;font-size:14px;z-index:99;display:none}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px;
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.09em}

dialog{border:1px solid var(--ink);padding:0;background:#fff;width:min(520px,94vw)}
dialog::backdrop{background:rgba(20,35,46,.55)}
.dlghead{padding:13px 16px;border-bottom:1.5px solid var(--ink);
  display:flex;justify-content:space-between;align-items:center}
.dlghead h3{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.08em;font-size:18px;margin:0}
.dlgbody{padding:16px;max-height:66vh;overflow:auto}
.dlgfoot{padding:13px 16px;border-top:1px solid var(--rule);display:flex;
  justify-content:flex-end;gap:9px}

.alloc{display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px dashed var(--rule);font-size:14px}
.alloc:last-child{border-bottom:0}

@media(max-width:820px){
  .stats{grid-template-columns:1fr 1fr}
  .payrow{grid-template-columns:1fr 1fr}
  .hide-sm{display:none}
}
:focus-visible{outline:2px solid var(--oxide);outline-offset:2px}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="crest" id="crest">··</div>
      <div>
        <h1 id="schoolName">Loading…</h1>
        <div class="sub" id="schoolSub">Connecting</div>
      </div>
    </div>
    <div class="nav">
      <a class="btn" href="students.html">Students</a>
      <a class="btn" href="fees.html">Fees</a>
      <a class="btn" href="challans.html">Challans</a>
      <a class="btn here" href="payments.html">Deposit</a>
      <a class="btn" href="reminders.html">Reminders</a>
      <button class="btn" onclick="smsSignOut()">Sign out</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="go(0,this)">Fee Counter</button>
    <button class="tab" onclick="go(1,this)">Today's Collection</button>
    <button class="tab" onclick="go(2,this)">Outstanding</button>
  </div>

  <!-- ============ COUNTER ============ -->
  <section class="view on">
    <div class="head"><h2>Fee Counter</h2>
      <div class="lbl">Oldest challan settles first</div></div>

    <div class="searchbig">
      <input type="text" id="find" placeholder="Search student — name, father, roll, admission no, CNIC"
             oninput="findStudent()" autocomplete="off">
      <button class="btn" onclick="clearAll()">Clear</button>
    </div>

    <div id="results"></div>
    <div id="detail"></div>
  </section>

  <!-- ============ TODAY ============ -->
  <section class="view">
    <div class="head">
      <h2>Collection</h2>
      <input type="date" id="colDate" onchange="loadDay()" style="width:auto">
    </div>
    <div class="stats" id="dayStats"></div>
    <div class="panel">
      <div class="panelhead">
        <div class="lbl" id="dayCount">—</div>
        <button class="btn sm" onclick="printDay()">Print day book</button>
      </div>
      <div id="dayBox"></div>
    </div>
  </section>

  <!-- ============ OUTSTANDING ============ -->
  <section class="view">
    <div class="head">
      <h2>Outstanding</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select id="oClass" onchange="renderDue()" style="width:auto"></select>
        <input type="text" id="oSearch" oninput="renderDue()" placeholder="Search" style="width:220px">
      </div>
    </div>
    <div class="stats" id="dueStats"></div>
    <div class="panel">
      <div class="panelhead"><div class="lbl" id="dueCount">—</div>
        <div class="lbl">Ledger balance, arrears counted once</div></div>
      <div id="dueBox"></div>
    </div>
  </section>
</div>

<dialog id="dlgReceipt">
  <div class="dlghead"><h3 id="rcTitle">Payment received</h3>
    <button class="btn" onclick="dlgReceipt.close()">Close</button></div>
  <div class="dlgbody" id="rcBody"></div>
  <div class="dlgfoot">
    <button class="btn" onclick="dlgReceipt.close()">Done</button>
    <button class="btn primary" onclick="printReceipt()">Print receipt</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const configured = !!(window.SMS_CONFIG && SMS_CONFIG.url.startsWith('https://'));
const sb = configured ? supabase.createClient(SMS_CONFIG.url, SMS_CONFIG.anonKey) : null;

let school=null, classes=[], current=null, currentChallans=[], lastReceipt=null;
let dayRows=[], dueRows=[];

const MONTHS=['January','February','March','April','May','June','July','August',
  'September','October','November','December'];
const METHODS=[['cash','Cash'],['bank_deposit','Bank slip'],['jazzcash','JazzCash'],
  ['easypaisa','Easypaisa'],['cheque','Cheque'],['online','Online']];

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3000)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function rs(n){return Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:0})}
function fmtd(d){if(!d)return '—';const [y,m,dd]=String(d).slice(0,10).split('-');return `${dd}-${m}-${y}`}

async function boot(){
  if(!configured){document.getElementById('schoolName').textContent='Not connected';return}
  const {data:{session}} = await sb.auth.getSession();
  if(!session){location.href='login.html';return}

  const {data:s} = await sb.from('schools').select('*').limit(1).maybeSingle();
  school=s;
  if(school){
    document.getElementById('schoolName').textContent=school.name;
    document.getElementById('schoolSub').textContent=
      `${school.address||''} · Session ${school.academic_year}`;
    document.getElementById('crest').textContent=
      school.name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
  }
  const {data:c}=await sb.from('classes').select('*').order('level_order');
  classes=c||[];
  document.getElementById('oClass').innerHTML='<option value="">All classes</option>'+
    classes.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');

  document.getElementById('colDate').value=new Date().toISOString().slice(0,10);
  await loadDay();
  await loadDue();
  document.getElementById('find').focus();
}

/* ---------------- counter ---------------- */
let findTimer;
function findStudent(){clearTimeout(findTimer);findTimer=setTimeout(runFind,220)}

async function runFind(){
  const q=document.getElementById('find').value.trim();
  const box=document.getElementById('results');
  if(q.length<2){box.innerHTML='';return}

  const qd=q.replace(/\D/g,'');
  let filter=`name.ilike.%${q}%,father_name.ilike.%${q}%,admission_no.ilike.%${q}%,roll_no.ilike.%${q}%`;
  if(qd.length>=4) filter+=`,guardian_cnic.ilike.%${qd}%,b_form.ilike.%${qd}%,guardian_phone.ilike.%${qd}%`;

  const {data}=await sb.from('v_students_roster').select('*')
    .eq('status','active').or(filter).limit(10);
  const list=data||[];

  if(!list.length){
    box.innerHTML=`<div class="panel"><div class="empty"><b>No match</b>
      Check the spelling, or try the admission number.</div></div>`;
    return;
  }
  if(list.length===1){box.innerHTML='';return openStudent(list[0].id)}

  box.innerHTML=`<div class="panel"><table><tbody>`+list.map(s=>`<tr>
      <td><div class="nm">${esc(s.name)}</div>
        <div class="fa">s/o ${esc(s.father_name)} · ${esc(s.class_label)}</div></td>
      <td class="r num" style="color:var(--ink-3)">${esc(s.admission_no)}</td>
      <td style="text-align:right"><button class="btn sm primary" onclick="openStudent('${s.id}')">Open</button></td>
    </tr>`).join('')+`</tbody></table></div>`;
}

async function openStudent(id){
  document.getElementById('results').innerHTML='';
  const {data:s}=await sb.from('v_students_roster').select('*').eq('id',id).maybeSingle();
  if(!s) return toast('Student not found');
  current=s;

  const {data:bal}=await sb.rpc('student_balance',{p_student_id:id});

  const {data:chal}=await sb.from('v_challan_print').select('*')
    .eq('student_id', id)
    .order('bill_year').order('bill_month');
  currentChallans=chal||[];

  const {data:pays}=await sb.from('v_payment_log').select('*')
    .eq('student_id',id).order('received_at',{ascending:false}).limit(8);

  renderDetail(Number(bal||0), pays||[]);
}

function renderDetail(balance, pays){
  const s=current;
  const owed=balance>0;
  const unpaid=currentChallans.filter(c=>c.status!=='paid');

  document.getElementById('detail').innerHTML=`
  <div class="studentcard">
    <div class="sc-top">
      <div>
        <h3>${esc(s.name)}</h3>
        <div class="meta">s/o ${esc(s.father_name)} &middot; ${esc(s.class_label)}
          &middot; ${esc(s.admission_no)}${s.guardian_phone?' &middot; '+esc(s.guardian_phone):''}</div>
      </div>
      <div class="sc-bal">
        <div class="lbl">${balance<0?'Advance held':'Outstanding'}</div>
        <div class="v ${owed?'owed':'clear'}">Rs ${rs(Math.abs(balance))}</div>
      </div>
    </div>

    <div class="payrow">
      <label class="field" style="margin:0"><span class="lbl">Amount received</span>
        <input type="number" id="payAmt" min="1" step="50" value="${owed?Math.round(balance):''}"
               placeholder="0" oninput="syncQuick()">
        <div class="quick">
          <button class="btn sm" onclick="setAmt(${Math.max(0,Math.round(balance))})">Full ${rs(Math.max(0,balance))}</button>
          ${unpaid.length?`<button class="btn sm" onclick="setAmt(${Math.round(unpaid[0].total)})">Oldest challan ${rs(unpaid[0].total)}</button>`:''}
          <button class="btn sm" onclick="setAmt(0)">Clear</button>
        </div>
      </label>
      <label class="field" style="margin:0"><span class="lbl">Method</span>
        <select id="payMethod">${METHODS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>
      <label class="field" style="margin:0"><span class="lbl">Reference / slip no</span>
        <input type="text" id="payRef" placeholder="optional"></label>
      <button class="btn go" style="padding:11px 18px" onclick="takePayment()">Receive</button>
    </div>
  </div>

  <div class="panel" style="margin-bottom:20px">
    <div class="panelhead"><div class="lbl">Challans</div>
      <div class="lbl">${unpaid.length} unpaid of ${currentChallans.length}</div></div>
    ${currentChallans.length?`<table><thead><tr>
        <th>Challan</th><th>Month</th><th class="r">Charged</th>
        <th class="r">Paid</th><th class="r hide-sm">Fine</th><th>Status</th></tr></thead><tbody>`+
      currentChallans.map(c=>{
        const own=Number(c.own_charges||0);
        return `<tr>
        <td class="num" style="font-size:12.5px">${esc(c.challan_no)}</td>
        <td>${MONTHS[c.bill_month-1]} ${c.bill_year}</td>
        <td class="r">${rs(own)}</td>
        <td class="r" style="color:var(--seal)">${rs(c.paid_amount)}</td>
        <td class="r hide-sm" style="color:${c.fine_now>0?'var(--oxide)':'var(--ink-3)'}">${c.fine_now>0?rs(c.fine_now):'—'}</td>
        <td><span class="pill ${c.status}">${c.status==='partial'?'Part paid':c.status}</span></td>
      </tr>`}).join('')+'</tbody></table>'
      :`<div class="empty"><b>No challans</b>Generate a challan run first.</div>`}
  </div>

  <div class="panel">
    <div class="panelhead"><div class="lbl">Recent receipts</div></div>
    ${pays.length?`<table><thead><tr>
        <th>Receipt</th><th>Date</th><th class="hide-sm">Method</th>
        <th class="r">Amount</th><th class="hide-sm">Applied to</th><th></th></tr></thead><tbody>`+
      pays.map(p=>`<tr>
        <td class="num" style="font-size:12.5px">${esc(p.receipt_no||'—')}</td>
        <td>${fmtd(p.received_at)}</td>
        <td class="hide-sm">${esc((METHODS.find(m=>m[0]===p.method)||[])[1]||p.method)}</td>
        <td class="r" style="font-weight:600;${p.is_reversed?'text-decoration:line-through;color:var(--ink-3)':''}">${rs(p.amount)}</td>
        <td class="hide-sm num" style="font-size:12px;color:var(--ink-3)">${esc(p.applied_to||'advance')}</td>
        <td style="text-align:right">${p.is_reversed
          ?`<span class="pill rev">Reversed</span>`
          :`<button class="btn sm danger" onclick="undoPayment('${p.id}')">Reverse</button>`}</td>
      </tr>`).join('')+'</tbody></table>'
      :`<div class="empty">No payments yet.</div>`}
  </div>`;
}

function setAmt(v){document.getElementById('payAmt').value = v>0? v : ''}
function syncQuick(){}

async function takePayment(){
  const amt=Number(document.getElementById('payAmt').value);
  if(!amt||amt<=0) return toast('Enter the amount received');

  const {data,error}=await sb.rpc('record_payment',{
    p_student_id: current.id,
    p_amount: amt,
    p_method: document.getElementById('payMethod').value,
    p_reference: document.getElementById('payRef').value.trim()||null,
    p_charge_fine: true
  });
  if(error) return toast(error.message);

  lastReceipt={...data, student:current};
  showReceipt(data);
  await openStudent(current.id);
  await loadDay(); await loadDue();
}

function showReceipt(d){
  const al=d.allocations||[];
  document.getElementById('rcTitle').textContent=`Receipt ${d.receipt_no}`;
  document.getElementById('rcBody').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px">
      <div><div class="lbl">Received from</div>
        <div style="font-weight:600;font-size:16px">${esc(current.name)}</div>
        <div style="color:var(--ink-3);font-size:13px">s/o ${esc(current.father_name)} · ${esc(current.class_label)}</div></div>
      <div style="text-align:right"><div class="lbl">Amount</div>
        <div class="num" style="font-size:26px;font-weight:600;color:var(--seal)">Rs ${rs(d.amount)}</div></div>
    </div>
    <div class="lbl" style="margin-bottom:6px">Applied to</div>
    ${al.length?al.map(a=>`<div class="alloc">
        <span>${MONTHS[a.month-1]} ${a.year} <span class="num" style="color:var(--ink-3);font-size:12.5px">${esc(a.challan_no)}</span>

      :'<div style="color:var(--ink-3);font-size:14px">Held as advance — no unpaid challan.</div>'}

    </div>`;

}

async function undoPayment(id){
  const why=prompt('Reason for reversal (kept in the record)');
  if(!why) return;
  const {error}=await sb.rpc('reverse_payment',{p_payment_id:id, p_reason:why});
  if(error) return toast(error.message);
  toast('Payment reversed');
  await openStudent(current.id); await loadDay(); await loadDue();
}

}

/* ---------------- day book ---------------- */
async function loadDay(){
  const d=document.getElementById('colDate').value;
  const {data}=await sb.from('v_payment_log').select('*')
    .gte('received_at', d+'T00:00:00')
    .lte('received_at', d+'T23:59:59.999')
    .order('received_at',{ascending:false});
  dayRows=data||[];

  const live=dayRows.filter(r=>!r.is_reversed);
  const total=live.reduce((s,r)=>s+Number(r.amount),0);
  const byM={};
  live.forEach(r=>byM[r.method]=(byM[r.method]||0)+Number(r.amount));

  document.getElementById('dayStats').innerHTML=`
    <div class="stat ok"><div class="lbl">Collected</div><div class="v">${rs(total)}</div></div>
    <div class="stat"><div class="lbl">Receipts</div><div class="v">${live.length}</div></div>
    <div class="stat"><div class="lbl">Cash</div><div class="v">${rs(byM.cash||0)}</div></div>
    <div class="stat"><div class="lbl">Other methods</div><div class="v">${rs(total-(byM.cash||0))}</div></div>`;

  document.getElementById('dayCount').textContent=
    `${live.length} receipt${live.length===1?'':'s'}${dayRows.length>live.length?` · ${dayRows.length-live.length} reversed`:''}`;

  document.getElementById('dayBox').innerHTML = dayRows.length ? `<table><thead><tr>
      <th>Receipt</th><th>Time</th><th>Student</th><th class="hide-sm">Class</th>
      <th class="hide-sm">Method</th><th class="r">Amount</th></tr></thead><tbody>`+
    dayRows.map(r=>`<tr>
      <td class="num" style="font-size:12.5px">${esc(r.receipt_no||'—')}</td>
      <td class="num" style="font-size:12.5px">${new Date(r.received_at).toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'})}</td>
      <td><div class="nm">${esc(r.student_name)}</div><div class="fa">${esc(r.admission_no)}</div></td>
      <td class="hide-sm num">${esc(r.class_name||'—')}</td>

      <td class="r" style="font-weight:600;${r.is_reversed?'text-decoration:line-through;color:var(--ink-3)':''}">${rs(r.amount)}</td>
    </tr>`).join('')+'</tbody></table>'
    : `<div class="empty"><b>Nothing collected</b>No payments recorded on this date.</div>`;
}

function bars(seed){
  let out='';
  const t=String(seed||'0');
  for(let i=0;i<46;i++){
    const w=(t.charCodeAt(i % t.length) % 3)+1;
    out+=`<i style="width:${w*0.42}mm;height:${w===3?8:6.5}mm"></i>`;
  }
  return out;
}

const W1=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven',
  'twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const W2=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function under100(n){return n<20?W1[n]:W2[Math.floor(n/10)]+(n%10?'-'+W1[n%10]:'')}
function numWords(v){
  let n=Math.floor(Number(v)||0);
  if(n===0) return 'Rupees zero only';
  let out='';
  for(const [div,name] of [[10000000,'crore'],[100000,'lakh'],[1000,'thousand'],[100,'hundred']]){
    const part=Math.floor(n/div);
    if(part>0){ out+=under100(part)+' '+name+' '; n%=div; }
  }
  if(n>0) out+=under100(n)+' ';
  out=out.trim();
  return 'Rupees '+out.charAt(0).toUpperCase()+out.slice(1)+' only';
}

/* ---------------- outstanding ---------------- */
async function loadDue(){
  const {data}=await sb.from('v_student_balances').select('*').order('name');
  dueRows=(data||[]).filter(r=>Number(r.outstanding)>0);
  renderDue();
}

function renderDue(){
  const cid=document.getElementById('oClass').value;
  const q=(document.getElementById('oSearch').value||'').trim().toLowerCase();
  let list=dueRows;
  if(cid) list=list.filter(r=>r.class_id===cid);
  if(q) list=list.filter(r=>
    (r.name||'').toLowerCase().includes(q)||
    (r.father_name||'').toLowerCase().includes(q)||
    (r.admission_no||'').toLowerCase().includes(q));

  const total=list.reduce((s,r)=>s+Number(r.outstanding),0);
  const over30=list.filter(r=>r.oldest_due_date &&
    (Date.now()-new Date(r.oldest_due_date))/864e5 > 30);

  document.getElementById('dueStats').innerHTML=`
    <div class="stat bad"><div class="lbl">Outstanding</div><div class="v">${rs(total)}</div></div>
    <div class="stat"><div class="lbl">Students</div><div class="v">${list.length}</div></div>
    <div class="stat bad"><div class="lbl">Over 30 days</div><div class="v">${over30.length}</div></div>
    <div class="stat"><div class="lbl">Average due</div><div class="v">${rs(list.length?total/list.length:0)}</div></div>`;

  document.getElementById('dueCount').textContent=`${list.length} students with a balance`;

  document.getElementById('dueBox').innerHTML = list.length ? `<table><thead><tr>
      <th>Student</th><th class="hide-sm">Class</th><th class="hide-sm">Oldest due</th>
      <th class="r">Outstanding</th><th></th></tr></thead><tbody>`+
    list.map(r=>{
      const days=r.oldest_due_date?Math.floor((Date.now()-new Date(r.oldest_due_date))/864e5):0;
      return `<tr>
      <td><div class="nm">${esc(r.name)}</div><div class="fa">s/o ${esc(r.father_name)} · ${esc(r.admission_no)}</div></td>
      <td class="hide-sm num">${esc(r.class_name||'—')}${r.section_name?'-'+esc(r.section_name):''}</td>
      <td class="hide-sm num" style="color:${days>30?'var(--oxide)':'var(--ink-3)'}">${days>0?days+'d':'—'}</td>
      <td class="r" style="font-weight:600;color:var(--oxide)">${rs(r.outstanding)}</td>
      <td style="text-align:right"><button class="btn sm primary" onclick="jumpTo('${r.student_id}')">Receive</button></td>
    </tr>`}).join('')+'</tbody></table>'
    : `<div class="empty"><b>Nothing outstanding</b>Every active student is clear.</div>`;
}

function jumpTo(id){
  go(0, document.querySelectorAll('.tab')[0]);
  openStudent(id);
}

function go(i,btn){
  document.querySelectorAll('.view').forEach((v,k)=>v.classList.toggle('on',k===i));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
}

boot();
